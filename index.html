<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쇼핑 리스트</title>
<style>
  :root {
    --bg: #f5f5f4;
    --card-bg: #ffffff;
    --text: #1c1917;
    --text-muted: #78716c;
    --border: #e7e5e4;
    --accent: #16a34a;
    --accent-hover: #15803d;
    --danger: #dc2626;
    --danger-hover: #b91c1c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .app {
    width: 100%;
    max-width: 420px;
  }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 20px;
    text-align: center;
  }
  form {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 1rem;
    background: var(--card-bg);
    color: var(--text);
  }
  input[type="text"]:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
  }
  button {
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 600;
  }
  form button {
    padding: 10px 16px;
    background: var(--accent);
    color: white;
  }
  form button:hover { background: var(--accent-hover); }

  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  li {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  li input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: var(--accent);
    flex-shrink: 0;
  }
  li span {
    flex: 1;
    word-break: break-word;
  }
  li.checked span {
    text-decoration: line-through;
    color: var(--text-muted);
  }
  li .del-btn {
    background: transparent;
    color: var(--danger);
    padding: 4px 8px;
    font-size: 1.1rem;
    line-height: 1;
  }
  li .del-btn:hover { color: var(--danger-hover); }

  .empty {
    text-align: center;
    color: var(--text-muted);
    padding: 24px 0;
    font-size: 0.9rem;
  }
  .footer {
    margin-top: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.85rem;
    color: var(--text-muted);
  }
  .clear-checked {
    background: transparent;
    color: var(--text-muted);
    text-decoration: underline;
    padding: 0;
    font-size: 0.85rem;
    font-weight: 400;
  }
  .clear-checked:hover { color: var(--danger); }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1917;
      --card-bg: #292524;
      --text: #f5f5f4;
      --text-muted: #a8a29e;
      --border: #44403c;
    }
  }
</style>
</head>
<body>
  <div class="app">
    <h1>🛒 쇼핑 리스트</h1>
    <form id="add-form">
      <input type="text" id="item-input" placeholder="살 물건을 입력하세요" autocomplete="off" autofocus>
      <button type="submit">추가</button>
    </form>
    <ul id="list"></ul>
    <div id="empty" class="empty" hidden>리스트가 비어 있어요. 항목을 추가해보세요.</div>
    <div class="footer">
      <span id="count"></span>
      <button type="button" class="clear-checked" id="clear-checked" hidden>체크된 항목 삭제</button>
    </div>
  </div>

<script>
(function () {
  const STORAGE_KEY = 'shopping-list-items';

  const form = document.getElementById('add-form');
  const input = document.getElementById('item-input');
  const list = document.getElementById('list');
  const emptyMsg = document.getElementById('empty');
  const countLabel = document.getElementById('count');
  const clearCheckedBtn = document.getElementById('clear-checked');

  function loadItems() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveItems(items) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }

  let items = loadItems();

  function render() {
    list.innerHTML = '';

    items.forEach(item => {
      const li = document.createElement('li');
      li.className = item.checked ? 'checked' : '';

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = item.checked;
      checkbox.addEventListener('change', () => toggleItem(item.id));

      const span = document.createElement('span');
      span.textContent = item.text;

      const delBtn = document.createElement('button');
      delBtn.className = 'del-btn';
      delBtn.type = 'button';
      delBtn.textContent = '✕';
      delBtn.setAttribute('aria-label', '삭제');
      delBtn.addEventListener('click', () => deleteItem(item.id));

      li.appendChild(checkbox);
      li.appendChild(span);
      li.appendChild(delBtn);
      list.appendChild(li);
    });

    emptyMsg.hidden = items.length !== 0;

    const total = items.length;
    const checkedCount = items.filter(i => i.checked).length;
    countLabel.textContent = total === 0 ? '' : `${checkedCount} / ${total} 완료`;
    clearCheckedBtn.hidden = checkedCount === 0;
  }

  function addItem(text) {
    const trimmed = text.trim();
    if (!trimmed) return;
    items.push({ id: Date.now() + Math.random().toString(36).slice(2), text: trimmed, checked: false });
    saveItems(items);
    render();
  }

  function toggleItem(id) {
    items = items.map(i => i.id === id ? { ...i, checked: !i.checked } : i);
    saveItems(items);
    render();
  }

  function deleteItem(id) {
    items = items.filter(i => i.id !== id);
    saveItems(items);
    render();
  }

  function clearChecked() {
    items = items.filter(i => !i.checked);
    saveItems(items);
    render();
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    addItem(input.value);
    input.value = '';
    input.focus();
  });

  clearCheckedBtn.addEventListener('click', clearChecked);

  render();
})();
</script>
</body>
</html>
